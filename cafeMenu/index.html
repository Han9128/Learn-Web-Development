<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Tell the browser to  set the character encoding to utf-8 which represent almost every character from every language-->
    <meta charset="utf-8" />
    <!-- This meta tag tells the browser:

            width=device-width
            Set the page width equal to the screen’s width (phone, tablet, laptop).
            Without this, mobile screens zoom out and your site looks tiny.

            initial-scale=1.0
            The initial zoom level should be 1 (normal size).
            Without this, pages may appear zoomed out or zoomed in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <!-- href provides the styles.css file name where css is written and rel tells that it 
     is stylesheet so it is rendered as css -->
    <link href="styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- we are using div to make a container for our menu all our menu conten will be here -->
    <div class="menu">
        <!-- this is the main part of our webpage so semantic tag main -->
      <main>
        <h1>CAMPER CAFE</h1>
        <p class="established">Est. 2020</p>
        <hr>
        <!-- Creating a section for coffee menu -->
        <section>
          <h2>Coffee</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <!-- article tag is used in HTML to mark independent, self-contained content -->
          <article class="item">
            <!-- this two p is put on same line for a purpose. when setting style width of both 
             50% it was not coming on the same line because when we write p on a seperate 
             line HTML treat it as some extra space so setting both width 50% already take the 
             whole width and then extra space due to new line cause them to appear on different 
             line -->
            <p class="flavor">French Vanilla</p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="flavor">Caramel Macchiato</p><p class="price">3.75</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">3.50</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">4.00</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p><p class="price">4.50</p>
          </article>
        </section>
        <!-- Start another section for desserts -->
        <section>
          <h2>Desserts</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Donut</p><p class="price">1.50</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">2.75</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">2.50</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <p>
            <!-- target = _blank is used to open a link in a new tab -->
          <a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>
        </p>
        <p class="address">123 Free Code Camp Drive</p>
      </footer>
    </div>
  </body>
</html>
