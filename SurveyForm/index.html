<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-sclae=1.0">
    <title>Survery Form</title>
    <link href="styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id = "survey-form" method="post" action="/submit">

      <fieldset>
      <label for="name" id="name-label">Name <input type="text" name="name" id="name" placeholder="your name" required></label>
      <label for="email" id="email-label">Email  <input type="email" name="email" id="email" placeholder="your email" required></label>
      <label for="number" id="number-label">Age (Optional) <input id="number" type="number" name="age" min="13" max="100" placeholder="18"></label>
      
      </fieldset>

      <fieldset>
        <label> Which option best describe your current role?</label>
        <select id="dropdown">
          <option> select current role</option>
          <option>student</option>
          <option>Full Time Job</option>
          <option>Full Time Learner</option>
        </select>
      </fieldset>

      <fieldset>
        <label>Would you recommend freeCodeCamp to a friend?</label>
        <label for="definitely" class="inline-label"> <input type="radio" name="recommendation" id="definitely" value="definitely" checked class="inline"> Definitely</label>
        <label for="may-be" class="inline-label"> <input type="radio" name="recommendation" id="may-be" value="may-be" class="inline"> May be</label>
        <label for="not-sure" class="inline-label"> <input type="radio" name="recommendation" id="not-sure" value="not sure" class="inline"> Not Sure</label>
      </fieldset>

      <fieldset>
        <label>What would you like to see improved <span id="parenthesis-text">(check all that apply)</span></label>
        
        <label for="front-end" class="inline-label"> <input type="checkbox" id="front-end" name="front-end-project" value="front-end-project" checked class="inline"> Front-end Projects</label>
        
         
        <label for="back-end" class="inline-label"> <input type="checkbox" id="back-end" name="back-end-project" value="back-end-project" class="inline"> Back-end Projects</label>
        
         
  
        <label for="data-visualization" class="inline-label"> <input type="checkbox" id="data-visualization" name="data-visualization" value="data-visualization" class="inline"> Data Visualization</label>
         
        <label for="challenges" class="inline-label"> <input type="checkbox" id="challenges" name="challenges" value="challenges" class="inline">
   Challenges</label>
       

         
        <label for="opensource" class="inline-label"> <input type="checkbox" id="opensource" name="opensource" value="opensource" class="inline"> OpenSoruce community</label>
      
         
        
        <label for="gitter" class="inline-label"> <input type="checkbox" id="gitter" name="gitter" value="gitter" class="inline"> Gitter help rooms</label>
        
        <label for="comment">Any Comments or Suggestions?</label>
        <textarea id="comment" name="comment" rows="7" cols="40" placeholder="Please write your message"></textarea>
      </fieldset>
      <input type="submit" id="submit" value="Submit">
    </form>
  </body>
</html>
