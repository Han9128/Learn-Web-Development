<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>
    <form method="post" action='https://register-demo.freecodecamp.org'>
        <!-- fieldset is used to club the related form inputs in a place -->
      <fieldset>
        <!-- for and id attribute with the same value links the label with input that is when cursor
          is clicked on the text of label it selects the respective input -->

          <!-- the name attribute is given so that when data is sent to the server its value represent which input is this for  -->
        <label for="first-name">Enter Your First Name: <input id="first-name" name="first-name" type="text" required /></label>
        <label for="last-name">Enter Your Last Name: <input id="last-name" name="last-name" type="text" required /></label>
        <label for="email">Enter Your Email: <input id="email" name="email" type="email" required /></label>
        <!-- pattern="[a-z0-5]{8,}" tells the browser that the password
     may include only a–z and digits 0–5, and must be at least 8 characters long -->
        <label for="new-password">Create a New Password: <input id="new-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required /></label>
      </fieldset>
      <fieldset>
        <legend>Account type (required)</legend>
        <!-- We give all radio buttons the same name so the browser treats them as one group.
     This makes sure only ONE option can be selected at a time.
     If each radio button had a different name, they would behave like checkboxes
     and multiple options could be selected. -->

     <!-- We give each radio button a meaningful value so that when it is selected,
     the form sends that specific value to the server. Without a value,
     the browser only sends "on", which doesn’t tell us which option was chosen. -->
        <label for="personal-account"><input id="personal-account" type="radio" name="account-type" class="inline" value="personal-account" checked /> Personal</label>
        <label for="business-account"><input id="business-account" type="radio" name="account-type" class="inline" value="business-account" /> Business</label>
      </fieldset>
      <fieldset>
        <!-- type="file" lets the user choose a file. When the form is submitted,
     the file is sent to the server as binary data using multipart/form-data.
     The name attribute ("file") is used as the key so the server knows 
     which file was uploaded. -->

     <!-- The file picker works even without enctype, but the file is not actually
     uploaded when the form is submitted. To send the file to the server, the
     form must use enctype="multipart/form-data". -->
        <label for="profile-picture">Upload a profile picture: <input id="profile-picture" type="file" name="file" /></label>
        <label for="age">Input your age (years): <input id="age" type="number" name="age" min="13" max="120" /></label>
        <label for="referrer">How did you hear about us?
            <!-- The select element sends its name ("referrer") and the value of the
     chosen option when the form is submitted. For example, selecting
     "freeCodeCamp News" sends referrer=1. -->
          <select id="referrer" name="referrer">
            <option value="">(select one)</option>
            <option value="1">freeCodeCamp News</option>
            <option value="2">freeCodeCamp YouTube Channel</option>
            <option value="3">freeCodeCamp Forum</option>
            <option value="4">Other</option>
          </select>
        </label>
        <label for="bio">Provide a bio:
            <!-- textarea is used to get multiline text as input we can use rows and cols to set area of the text box -->
          <textarea id="bio" name="bio" rows="3" cols="30" placeholder="I like coding on the beach..."></textarea>
        </label>
      </fieldset>
      <label for="terms-and-conditions">
        <input class="inline" id="terms-and-conditions" type="checkbox" required name="terms-and-conditions" /> I accept the <a href="https://www.freecodecamp.org/news/terms-of-service/">terms and conditions</a>
      </label>
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
